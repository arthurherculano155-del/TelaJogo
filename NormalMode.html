<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Tabuada</title>
    <link rel="stylesheet" href="Player2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png">
</head>

<body>

    <div class="tela">

        <div class="container" id="game">

            <h1>TABUADA</h1>

            <div class="pergunta" id="pergunta">
                1 × 1
            </div>

            <input type="number" id="resposta">

            <br>

            <button onclick="verificar()">
                RESPONDER
            </button>

            <div class="info">
                <span><img src="MineHeart.png" alt="">
                    <p id="vidas">3</p>
                </span>

                <h2 class="hi">Pergunta: <span id="p"></span></h2>

                <span><img src="MinecraftCLock-removebg-preview.png" alt="">
                    <p id="tempo">5</p>
                </span>
            </div>


        </div>

        <div class="final" id="final">

            <h2>GAME OVER 💀</h2>

            <p>Pontos: <span id="pontos"></span></p>

            <button onclick="location.reload()">
                Jogar Novamente
            </button> <br>

            <a href="index.html">
                <button>Voltar ao Lobby</button>
            </a>

        </div>

        <div class="ganhou" id="win">
            <h2 class="p">VOCÊ GANHOU!! 🍭</h2>
            <p id="wins"></p>
            <button onclick="location.reload()">Jogar Novamente</button> <br>

            <a href="index.html">
                <button>Voltar ao Lobby</button>
            </a>
        </div>

    </div>

    <script src="normalMode.js"></script>

</body>

</html>
